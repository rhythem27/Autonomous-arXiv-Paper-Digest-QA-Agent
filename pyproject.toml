[project]
name = "autonomous-arxiv-digest-agent"
version = "0.1.0"
description = "Autonomous arXiv Paper Digest & QA Agent powered by LangGraph, Gemini 2.5 Flash, and Qdrant Local"
authors = [
    {name = "AI Research Team", email = "dev@example.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "google-genai>=0.1.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "pymupdf>=1.24.0",
    "arxiv>=2.1.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "rich>=13.8.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
]

[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-mock = ">=3.14.0"
pytest-asyncio = ">=0.24.0"
ipykernel = ">=6.29.0"
ipywidgets = ">=8.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
